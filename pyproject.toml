# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
[project]
name = "slurm-monitor"
dynamic = ["version"]
description = "Slurm monitor contains a 'probe' implementation to publish monitoring data from nodes, a collector to make monitor data persistent in a database, and a REST API component to make the data accessible"
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["slurm", "monitor"]
authors = [
    { name = "Thomas Roehr", email = "roehr@simula.no" }
]
requires-python = ">=3.10"
maintainers = [
    { name = "Thomas Roehr", email = "roehr@simula.no" }
]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Lanugage :: Python :: 3.10",
    "Programming Lanugage :: Python :: 3.11",
    "Programming Lanugage :: Python :: 3.12",
    "License :: OSI Approved :: BSD License",
]
dependencies = [
    "asyncpg",
    "aiosqlite",
    "cachetools",
    "fastparquet",
    "fastapi[standard]",
    "fastapi-cache2[memcache]",
    "fastapi_utils",
    "fastapi-pagination",
    "greenlet",
    "kafka-python<3.0.0",
    "networkx",
    "numpy",
    "pandas",
    "prometheus-fastapi-instrumentator",
    "psutil",
    "pyarrow",
    "pydantic",
    "pydantic-settings",
    "pyjwt[crypto]",
    "pyyaml",
    "pyzmq",
    "psycopg2-binary",
    "python-snappy",
    "sqlalchemy",
    "sqlalchemy-schemadisplay",
    "tqdm",
    "typing_inspect",
    "uvicorn",
    "fastmcp>=3.4.7",
]

[project.optional-dependencies]
# Optional deps that library consumers can install to enable vendorlib features
#      pip install slurm-monitor[vendorlibs]
# or using uv:
#     uv add slurm-monitor[vendorlibs]
vendorlibs = [
    "nvidia-ml-py",
    "pyrsmi"
]

[project.urls]
homepage = "https://github.com/2maz/slurm-monitor"
documentation = "https://2maz.github.io/slurm-monitor"
repository = "https://github.com/2maz/slurm-monitor"

[project.scripts]
slurm-monitor = "slurm_monitor.cli.main:run"


[dependency-groups]
# To install with pip, requires pip >= 25.1:
#     pip install --group dev slurm-monitor
# or using uv:
#     uv sync --dev
dev = [
    "alembic",
    "isort",
    "jupyter-book<2",
    "pre-commit",
    "ruff",
    "sphinx-autoapi",
    {include-group = "test"}
]
test = [
    "coverage",
    "httpx",
    "pytest",
    "pytest-asyncio",
    "pytest-console-scripts",
    "pytest-cov",
    "pytest-mock",
    "pydot",
    "tox",
    "basedpyright>=1.40.1",
]


[build-system]
requires = ["setuptools >= 61.0.0",
    "build",
    "sphinx"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
    script-files = [
        "bin/slurm-monitor-probes-ctl",
        "bin/slurm-monitor-ctl"
    ]

[tool.setuptools.package-data]
"slurm_monitor" = [ "resources/**/*" ]

[tool.setuptools.dynamic]
version = { attr = "slurm_monitor.__version__" }

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/Path() are meant to be called in argument
# defaults -- that's the framework's DI pattern, not the bug B008 looks for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
