[tox]
name=slurm_monitor
artifacts_dir={toxinidir}/artifacts
min_version = 4.0
env_list = py

[testenv]
extras =
    test

allowlist_externals =
    bash
    pytest
    docker
    echo

passenv =
    PYTEST_ARGS

commands =
    pytest --cov={[tox]name} \
           --cov-report=html:{[tox]artifacts_dir}/tests/ \
           --cov-report=term \
           --cov-report=xml:{[tox]artifacts_dir}/tests/cobertura-coverage.xml \
           {toxinidir}/tests/slurm_monitor {env:PYTEST_ARGS:}

[testenv:timescaledb]
extras =
    test

allowlist_externals =
    bash
    pytest
    docker

passenv =
    PYTEST_ARGS

# tox owns timescaledb container, commands_pre starts it and blocks until it's actually reachable
commands_pre =
    -docker rm -f timescaledb-pytest
    docker run -d --rm --name timescaledb-pytest -p 7654:5432 -e POSTGRES_DB=test -e POSTGRES_PASSWORD=test -e POSTGRES_USER=test timescale/timescaledb:latest-pg16
    # check readiness
    docker exec timescaledb-pytest timeout 60 sh -c 'until pg_isready -q -h 127.0.0.1 -U test; do sleep 0.5; done'
    # test_db_parser needs its own clean database, create it in the same container
    docker exec timescaledb-pytest psql -U test -d test -c "CREATE DATABASE test_db_parser"

commands =
    pytest --cov={[tox]name} \
           --cov-report=html:{[tox]artifacts_dir}/tests/ \
           --cov-report=term \
           --cov-report=xml:{[tox]artifacts_dir}/tests/cobertura-coverage.xml \
           {toxinidir}/tests/slurm_monitor --db-uri timescaledb://test:test@localhost:7654/test {env:PYTEST_ARGS:} --durations=25

# cleans up the timescaledb container after tests, even if the tests fail
commands_post =
    -docker stop timescaledb-pytest

[testenv:build]
use_develop=True
deps =
    pyinstaller

allowlist_externals =
    pyinstaller
    bash
    rm

commands =
    bash -c "pyinstaller --onefile --distpath {toxinidir}/dist/$(uname -i) --name slurm-monitor {toxinidir}/src/slurm_monitor/cli/main.py"

[testenv:build-nuitka]
use_develop=True
deps =
    nuitka
    patchelf

allowlist_externals =
    export
    bash
    rm

commands =
    bash -c " \
        export NUITKA_BUILD_ARCH=$(python -c 'import platform; print(platform.machine())'); \
        nuitka --onefile --output-filename=slurm-monitor --output-dir={toxinidir}/dist/$NUITKA_BUILD_ARCH {toxinidir}/src/slurm_monitor/cli/main.py; \
    "

[testenv:build_docs]
skip_install = true
deps =
    jupyter-book
commands =
    python -m pip install pydot
    python -m pip install .[dev] -U
    jupyter book build docs
