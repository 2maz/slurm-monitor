# Check linting and formatting using Ruff
name: Check linting and formatting

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-format:
    name: Check linting and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install Ruff
        run: pip install ruff==0.16.6
      - name: Run Ruff lint
        run: ruff check
      - name: Run Ruff format check
        run: ruff format --check
